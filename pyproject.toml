[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "visionsim"
description = "Towards a Sensor-Realistic World Simulator"
dynamic = ["version"]
requires-python = ">=3.9"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "imageio",
    "more_itertools",
    "numpy",
    "torch",
    "matplotlib",
    "scipy",
    "invoke",
    "natsort",
    "rich",
    "OpenEXR",
    "multiprocess",
    "rpyc",
    "fastdigest",
    "tyro",
    "ephemeral-port-reserve",
    "peewee",
    "pydantic",
    "typing-extensions",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
"GitHub" = "https://github.com/WISION-Lab/visionsim"

[project.scripts]
visionsim = "visionsim.cli:main"
vsim = "visionsim.cli:main"

[tool.hatch.version]
path = "visionsim/__init__.py"

[tool.ruff]
line-length = 121
force-exclude = true
exclude = [
    "visionsim/interpolate/rife/*",
    "visionsim/simulate/heatsim/solver.py",
    "visionsim/simulate/heatsim/laplacian.py",
    "visionsim/simulate/heatsim/constants.py",
    "visionsim/simulate/heatsim/light_models.py",
    "visionsim/simulate/heatsim/sh9_sky.py",
    "visionsim/simulate/heatsim/sky_visibility.py",
    "visionsim/simulate/heatsim/bvh_backend.py",
    "visionsim/simulate/heatsim/temperature_io.py",
    "visionsim/simulate/heatsim/uv_utils.py",
]

[tool.mypy]
exclude = [
    "visionsim/interpolate/rife/*",
    "visionsim/simulate/heatsim/solver\\.py",
    "visionsim/simulate/heatsim/laplacian\\.py",
    "visionsim/simulate/heatsim/constants\\.py",
    "visionsim/simulate/heatsim/irradiance_kernel\\.py",
    "visionsim/simulate/heatsim/light_models\\.py",
    "visionsim/simulate/heatsim/sh9_sky\\.py",
    "visionsim/simulate/heatsim/sky_visibility\\.py",
    "visionsim/simulate/heatsim/bvh_backend\\.py",
    "visionsim/simulate/heatsim/temperature_io\\.py",
    "visionsim/simulate/heatsim/properties\\.py",
    "visionsim/simulate/heatsim/irradiance\\.py",
    "visionsim/simulate/heatsim/uv_utils\\.py",
]
follow_imports="skip"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "twine>=6.2.0",
    "mypy",
    "coverage",
    "hypothesis",
    "pre-commit",
    "pytest",
    "ruff",
    "types-jsonschema",
    'scipy-stubs; python_version >= "3.10"',
    "psutil",
    "types-peewee",
    "syrupy>=4.9.1",
]
docs = [
    "invoke",
    "rich",
    "sphinx",
    "sphinxcontrib-programoutput>=0.18",
    "click_extra[sphinx,pygments]",
    "myst-parser",  # Should not be needed, but click_extra throws an error if it's not installed
    "sphinx-copybutton",
    "sphinxcontrib-video",
    "sphinxcontrib-napoleon",
    "furo",
]
